      <line x1="898" y1="182" x2="912" y2="168"/>
      <line x1="742" y1="338" x2="728" y2="352"/>
    </g>
  </g>
  <g fill="none" stroke="#466978" stroke-opacity="0.10" stroke-width="8">
    <circle cx="940" cy="380" r="55"/>
