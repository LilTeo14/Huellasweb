<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="1200" fill="#ffffff"/>

  <g transform="translate(600,600)">
    <!-- Constelación de nodos -->
    <g stroke="#466978" stroke-opacity="0.12" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="330"/>
      <line x1="0" y1="-330" x2="233" y2="-233"/>
      <line x1="233" y1="-233" x2="330" y2="0"/>
      <line x1="330" y1="0" x2="233" y2="233"/>
      <line x1="233" y1="233" x2="0" y2="330"/>
      <line x1="0" y1="330" x2="-233" y2="233"/>
      <line x1="-233" y1="233" x2="-330" y2="0"/>
      <line x1="-330" y1="0" x2="-233" y2="-233"/>
      <line x1="-233" y1="-233" x2="0" y2="-330"/>
      <line x1="0" y1="-330" x2="0" y2="330"/>
      <line x1="-330" y1="0" x2="330" y2="0"/>
    </g>
    <g fill="#466978" fill-opacity="0.16">
      <circle cx="0" cy="-330" r="6"/>
      <circle cx="233" cy="-233" r="6"/>
      <circle cx="330" cy="0" r="6"/>
      <circle cx="233" cy="233" r="6"/>
      <circle cx="0" cy="330" r="6"/>
      <circle cx="-233" cy="233" r="6"/>
      <circle cx="-330" cy="0" r="6"/>
      <circle cx="-233" cy="-233" r="6"/>
    </g>

    <!-- Iconos de energia y sostenibilidad en los nodos -->
    <g stroke="#466978" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Hoja (arriba) -->
      <g transform="translate(0,-330)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <path d="M-14 12 C -14 -14, 14 -14, 14 -18 C 14 8, -2 16, -14 12 Z"/>
      </g>
      <!-- Globo (arriba derecha) -->
      <g transform="translate(233,-233)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <circle r="16"/>
        <path d="M-16 0 h32 M0 -16 v32 M-13 -9 q13 8 26 0 M-13 9 q13 -8 26 0"/>
      </g>
      <!-- Grafico (derecha) -->
      <g transform="translate(330,0)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <path d="M-14 10 L-4 -2 L6 4 L16 -14"/>
        <circle cx="-14" cy="10" r="2.2" fill="#466978" stroke="none"/>
        <circle cx="-4" cy="-2" r="2.2" fill="#466978" stroke="none"/>
        <circle cx="6" cy="4" r="2.2" fill="#466978" stroke="none"/>
        <circle cx="16" cy="-14" r="2.2" fill="#466978" stroke="none"/>
      </g>
      <!-- Sol (abajo derecha) -->
      <g transform="translate(233,233)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <circle r="10"/>
        <path d="M0 -20 v6 M0 14 v6 M-20 0 h6 M14 0 h6 M-14 -14 l4 4 M10 10 l4 4 M-14 14 l4 -4 M10 -10 l4 -4"/>
      </g>
      <!-- Gota (abajo) -->
      <g transform="translate(0,330)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <path d="M0 -16 C 10 -2, 16 8, 0 16 C -16 8, -10 -2, 0 -16 Z"/>
      </g>
      <!-- Casa (abajo izquierda) -->
      <g transform="translate(-233,233)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <path d="M-16 4 L0 -14 L16 4 M-11 4 V16 H11 V4"/>
      </g>
      <!-- Reciclaje (izquierda) -->
      <g transform="translate(-330,0)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <path d="M0 -14 L8 -1 H-3 M-14 8 L-8 -5 L0 1 M14 8 L1 8 L6 -3"/>
      </g>
      <!-- Bombilla ecologica (arriba izquierda) -->
      <g transform="translate(-233,-233)">
        <circle r="34" stroke-dasharray="4 6" stroke-opacity="0.18"/>
        <circle cy="-4" r="13"/>
        <path d="M-6 9 h12 M-4 15 h8"/>
      </g>
    </g>

    <!-- Bombilla central -->
    <g transform="translate(0,0)">
      <circle r="118" fill="#466978" fill-opacity="0.05"/>
      <g stroke="#466978" stroke-opacity="0.34" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -62 C 42 -62, 62 -30, 52 6 C 45 30, 28 34, 26 54 H-26 C-28 34, -45 30, -52 6 C-62 -30, -42 -62, 0 -62 Z"/>
        <path d="M-14 30 Q0 10 14 30" stroke-opacity="0.5"/>
        <path d="M-22 54 H22 M-18 66 H18 M-13 78 H13"/>
      </g>
      <g fill="#f2a93c" fill-opacity="0.55">
        <path d="M0 -34 L10 -6 L-2 -6 L4 22 L-14 -10 L-2 -10 Z"/>
      </g>
    </g>
  </g>
</svg>
